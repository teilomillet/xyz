name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.2
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'teilo-xyz' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Cloudflare credentials are not configured; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hugo CLI
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Build with Hugo
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://teilo.xyz/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Check homepage size budget
        if: steps.cloudflare.outputs.ready == 'true'
        run: scripts/check-homepage-budget.sh public

      - name: Check Cloudflare Pages middleware
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/check-cloudflare-pages.mjs public

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        run: npx --yes wrangler@latest pages deploy public --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="${GITHUB_REF_NAME}"
