baseURL = 'https://teilo.xyz/'
languageCode = 'en-us'
title = "teïlo"

[params]
author = "Teïlo Millet"
description = "I build open-source tools for language models and write about AI."

github = "teilomillet"
twitter = "teilomillet"
linkedin = "teilomillet"
email = "teilomillet@gmail.com"

[menu]
[[menu.main]]
name = "posts"
url = "/posts/"
weight = 1

[[menu.main]]
name = "conversations"
url = "/conversations/"
weight = 2

[[menu.main]]
name = "collections"
url = "/collections/"
weight = 3


[services.rss]
limit = -1

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    notAlternative = false

[outputs]
  home = ["HTML", "RSS", "Markdown"]
  section = ["HTML", "RSS", "Markdown"]
  page = ["HTML", "Markdown"]

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]
