<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <nav>
    <a href="/">{{ .Site.Title }}</a>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
    <button class="toggle" onclick="document.body.classList.toggle('dark');localStorage.setItem('t',document.body.classList.contains('dark'))">
      light/dark
    </button>
  </nav>
  {{- block "main" . }}{{ end -}}
  <footer>&copy; 2026 Teïlo Millet</footer>
  <script>
var saved=localStorage.getItem('t')
if(saved!==null){if(saved==='true')document.body.classList.add('dark')}
else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark')
;(function(){
  var s=document.querySelector('.sidebar');if(!s)return
  var links=s.querySelectorAll('a'),map=[]
  links.forEach(function(a){
    var id=a.getAttribute('href')
    if(id){var el=document.getElementById(id.substring(1));if(el)map.push({a:a,el:el})}
  })
  if(!map.length)return
  window.addEventListener('scroll',function(){
    var current=-1
    map.forEach(function(m,i){if(m.el.getBoundingClientRect().top<=80)current=i})
    map.forEach(function(m,i){
      if(i<current)m.a.classList.add('past')
      else m.a.classList.remove('past')
    })
    if(current>=0&&current<map.length){
      var a=map[current].a
      var sh=s.clientHeight
      var at=a.getBoundingClientRect().top-s.getBoundingClientRect().top+s.scrollTop
      if(at<s.scrollTop+20||at>s.scrollTop+sh-40)s.scrollTo({top:at-sh/3,behavior:'smooth'})
    }
  })
})()
;(function(){
  var active=null
  function close(){if(active){active.remove();active=null}}
  document.addEventListener('click',function(e){
    var ref=e.target.closest('a[href^="#fn:"]')
    if(ref){
      e.preventDefault()
      close()
      var id=ref.getAttribute('href').substring(1)
      var fn=document.getElementById(id)
      if(!fn)return
      var pop=document.createElement('div')
      pop.className='fn-popover'
      pop.innerHTML=fn.innerHTML
      document.body.appendChild(pop)
      var rect=ref.getBoundingClientRect()
      var top=rect.bottom+window.scrollY+8
      var left=rect.left+window.scrollX-pop.offsetWidth/2+rect.width/2
      if(left<8)left=8
      if(left+pop.offsetWidth>window.innerWidth-8)left=window.innerWidth-pop.offsetWidth-8
      pop.style.top=top+'px'
      pop.style.left=left+'px'
      active=pop
      return
    }
    if(!e.target.closest('.fn-popover'))close()
  })
})()
  </script>
</body>
</html>
